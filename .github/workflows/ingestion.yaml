name: Connector CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: connector-app
  ECS_CLUSTER: prod-cluster
  ECS_SERVICE: connector-service
  ECS_TASK_DEFINITION: ecs-task-definition.json
  CONTAINER_NAME: connector-app

jobs:

################################################################################
# Validate + Unit Test
################################################################################

  validate-unit-test:
    name: Validate and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Validate
        run: npm ci --dry-run

      - name: Run Unit Tests
        run: npm test -- --coverage

################################################################################
# Build Connector Dependencies
################################################################################

  build-dependencies:
    name: Build Connector Dependencies
    runs-on: ubuntu-latest
    needs: validate-unit-test

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

################################################################################
# Docker Build
################################################################################

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-dependencies

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

################################################################################
# SBOM Generation
################################################################################

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.CONTAINER_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.json

################################################################################
# Prisma Scan
################################################################################

  prisma-scan:
    name: Prisma Cloud Scan
    runs-on: ubuntu-latest
    needs: sbom

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

      - name: Download TwistCLI
        run: |
          curl -k \
          -u "${{ secrets.PRISMA_ACCESS_KEY }}:${{ secrets.PRISMA_SECRET_KEY }}" \
          https://${{ secrets.PRISMA_CONSOLE_URL }}/api/v1/util/twistcli \
          --output twistcli

          chmod +x twistcli

      - name: Prisma Image Scan
        run: |
          ./twistcli images scan \
            --address https://${{ secrets.PRISMA_CONSOLE_URL }} \
            --user "${{ secrets.PRISMA_ACCESS_KEY }}" \
            --password "${{ secrets.PRISMA_SECRET_KEY }}" \
            ${CONTAINER_NAME}:${{ github.sha }}

################################################################################
# Push Image To ECR
################################################################################

  push-ecr:
    name: Push Docker Image To ECR
    runs-on: ubuntu-latest
    needs: prisma-scan

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

      - name: Tag Docker Image
        run: |
          docker tag \
          ${CONTAINER_NAME}:${{ github.sha }} \
          ${{ 
