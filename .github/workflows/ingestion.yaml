name: Connector CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: connector-app
  ECS_CLUSTER: prod-cluster
  ECS_SERVICE: connector-service
  ECS_TASK_DEFINITION: ecs-task-definition.json
  CONTAINER_NAME: connector-app

jobs:

###############################################################################
# Validate + Unit Test
###############################################################################

  validate-unit-test:
    name: Validate and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Code
        run: npm ci --dry-run

      - name: Run Unit Tests
        run: npm test -- --coverage

###############################################################################
# Build Connector Dependencies
###############################################################################

  build-dependencies:
    name: Build Connector Dependencies
    runs-on: ubuntu-latest
    needs: validate-unit-test

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

###############################################################################
# Docker Build
###############################################################################

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-dependencies

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

###############################################################################
# Generate SBOM
###############################################################################

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.CONTAINER_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json

###############################################################################
# Prisma Cloud / Twistlock Scan
###############################################################################

  prisma-scan:
    name: Prisma Cloud Scan
    runs-on: ubuntu-latest
    needs: sbom

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

      - name: Download TwistCLI
        run: |
          curl -k \
          -u "${{ secrets.PRISMA_ACCESS_KEY }}:${{ secrets.PRISMA_SECRET_KEY }}" \
          "https://${{ secrets.PRISMA_CONSOLE_URL }}/api/v1/util/twistcli" \
          --output twistcli

          chmod +x twistcli

      - name: Scan Docker Image
        run: |
          ./twistcli images scan \
            --address https://${{ secrets.PRISMA_CONSOLE_URL }} \
            --user "${{ secrets.PRISMA_ACCESS_KEY }}" \
            --password "${{ secrets.PRISMA_SECRET_KEY }}" \
            ${CONTAINER_NAME}:${{ github.sha }}

###############################################################################
# Push Image To ECR
###############################################################################

  push-ecr:
    name: Push Image To ECR
    runs-on: ubuntu-latest
    needs: prisma-scan

    outputs:
      image_uri: ${{ steps.export.outputs.image_uri }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login To Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -f Dockerfile \
            -t ${CONTAINER_NAME}:${{ github.sha }} .

      - name: Tag Docker Image
        run: |
          docker tag \
            ${CONTAINER_NAME}:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Export Image URI
        id: export
        run: |
          echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

###############################################################################
# Package Lambda Handlers
###############################################################################

  package-handlers:
    name: Package Lambda Handlers
    runs-on: ubuntu-latest
    needs: push-ecr

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Package Lambda Functions
        run: |
          mkdir -p artifacts
          zip -r artifacts/lambda-handler.zip lambda/

      - name: Upload Lambda Package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-handler
          path: artifacts/lambda-handler.zip

###############################################################################
# Deploy ECS Service
###############################################################################

  deploy-ecs:
    name: Deploy ECS Service
    runs-on: ubuntu-latest
    needs:
      - push-ecr
      - package-handlers

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render ECS Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.push-ecr.outputs.image_uri }}

      - name: Deploy ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

###############################################################################
# Smoke Test
###############################################################################

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-ecs

    steps:
      - name: Application Health Check
        run: |
          APP_URL=https://your-domain.com/health

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")

          if [ "$STATUS" != "200" ]; then
            echo "Smoke Test Failed"
            exit 1
          fi

          echo "Smoke Test Passed"
