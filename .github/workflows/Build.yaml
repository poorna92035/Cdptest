name: Dmaas-api-backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  APP_NAME: dmaas-api
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 src 

      - name: black --check
        run: black --check src 

      - name: isort --check-only
        run: isort --check-only src 

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest --cov=src --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # --- These steps are written against real tools/actions and will run
  # for real as soon as the matching repo secrets exist. Until then GitHub
  # Actions will fail the job at the auth step with a clear "invalid
  # credentials" error rather than silently no-opping — that's intentional:
  # it tells you exactly which secret is still missing. Required secrets are
  # listed above each job.

  nexus-iq:
    name: Nexus IQ (dependency/OSS scan)
    runs-on: ubuntu-latest
    needs: unit-tests
    # Required secrets: NEXUS_IQ_SERVER_URL, NEXUS_IQ_USERNAME, NEXUS_IQ_PASSWORD
    # Required var:     NEXUS_IQ_APPLICATION_ID
    steps:
      - uses: actions/checkout@v4

      - name: Run Nexus IQ scan
        uses: sonatype-nexus-community/iq-github-action@v2
        with:
          serverUrl: ${{ secrets.NEXUS_IQ_SERVER_URL }}
          username: ${{ secrets.NEXUS_IQ_USERNAME }}
          password: ${{ secrets.NEXUS_IQ_PASSWORD }}
          application: ${{ vars.NEXUS_IQ_APPLICATION_ID }}
          stage: build
          target: "."

  build:
    name: Build (Docker image from Dockerfile)
    runs-on: ubuntu-latest
    needs: [nexus-iq]
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image_tag=${SHORT_SHA}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image from Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.APP_NAME }}:${{ steps.vars.outputs.image_tag }}
          push: false
          load: false
          outputs: type=docker,dest=image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  sbom:
    name: SBOM (Syft)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: "${{ env.APP_NAME }}:${{ needs.build.outputs.image_tag }}"
          format: cyclonedx-json
          output-file: sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  twistlock-scan:
    name: Twistlock / Prisma Cloud Compute Image Scan
    runs-on: ubuntu-latest
    needs: build
    # Required secrets: PRISMA_COMPUTE_CONSOLE_URL, PRISMA_COMPUTE_USER, PRISMA_COMPUTE_PASSWORD
    # (Console URL is your Prisma Cloud Compute console, e.g. https://<console>.twistlock.com)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar

      - name: Download twistcli from the Console
        run: |
          curl -k -u "${{ secrets.PRISMA_COMPUTE_USER }}:${{ secrets.PRISMA_COMPUTE_PASSWORD }}" \
            --output twistcli \
            "${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}/api/v1/util/twistcli"
          chmod +x twistcli

      - name: Run Twistlock image scan (gated — fails build on policy violation)
        run: |
          ./twistcli images scan \
            --address "${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}" \
            --user "${{ secrets.PRISMA_COMPUTE_USER }}" \
            --password "${{ secrets.PRISMA_COMPUTE_PASSWORD }}" \
            --details \
            --output-file twistlock-results.json \
            "${APP_NAME}:${{ needs.build.outputs.image_tag }}"
          # twistcli exits non-zero automatically when the image fails the
          # Prisma Cloud Compute policy (critical/high vulns, compliance
          # checks, etc.), which fails this step and blocks the job below.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twistlock-results
          path: twistlock-results.json

  publish-nexus:
    name: Publish to Nexus
    runs-on: ubuntu-latest
    needs: [sbom, twistlock-scan]
    # Required secrets: NEXUS_REGISTRY, NEXUS_USERNAME, NEXUS_PASSWORD
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to Nexus Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Tag and push to Nexus
        run: |
          docker tag "${APP_NAME}:${{ needs.build.outputs.image_tag }}" \
            "${{ secrets.NEXUS_REGISTRY }}/${APP_NAME}:${{ needs.build.outputs.image_tag }}"
          docker push "${{ secrets.NEXUS_REGISTRY }}/${APP_NAME}:${{ needs.build.outputs.image_tag }}"

  publish-ecr:
    name: Publish to ECR
    runs-on: ubuntu-latest
    needs: publish-nexus
    # Required secret: AWS_DEPLOY_ROLE_ARN
    # Required vars:   ECR_REPOSITORY, AWS_REGION
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Load image
        run: docker load -i image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to ECR
        run: |
          docker tag "${APP_NAME}:${{ needs.build.outputs.image_tag }}" \
            "${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}"
          docker push "${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}"

      - name: Record build metadata
        run: |
          {
            echo "image_tag=${{ needs.build.outputs.image_tag }}"
            echo "git_sha=${{ github.sha }}"
            echo "nexus_image=${{ secrets.NEXUS_REGISTRY }}/${APP_NAME}:${{ needs.build.outputs.image_tag }}"
            echo "ecr_image=${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> build-metadata.txt

      - uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: build-metadata.txt
