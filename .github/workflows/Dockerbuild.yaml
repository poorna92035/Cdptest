name: Dmaas-api-backend

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Required for GitHub OIDC authentication with AWS.
permissions:
  contents: read
  id-token: write

env:
  APP_NAME: dmaas-api
  PYTHON_VERSION: "3.12"

jobs:

  # ============================================================
  # 1. LINT
  # ============================================================
  lint:
    name: Lint
    runs-on: [self-hosted, ifc-datalab-claims-k8s-site1-oke-np1]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: |
          flake8 src

      - name: Run black check
        run: |
          black --check src

      - name: Run isort check
        run: |
          isort --check-only src


  # ============================================================
  # 2. UNIT TESTS
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, ifc-datalab-claims-k8s-site1-oke-np1]
    needs: lint

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  # ============================================================
  # 3. NEXUS IQ DEPENDENCY / OSS SCAN
  # ============================================================
  nexus-iq:
    name: Nexus IQ - Dependency / OSS Scan
    runs-on: [self-hosted, ifc-datalab-claims-k8s-site1-oke-np1]
    needs: unit-tests

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Nexus IQ scan
        uses: sonatype-nexus-community/iq-github-action@v2
        with:
          serverUrl: ${{ secrets.NEXUS_IQ_SERVER_URL }}
          username: ${{ secrets.NEXUS_IQ_USERNAME }}
          password: ${{ secrets.NEXUS_IQ_PASSWORD }}
          application: ${{ vars.NEXUS_IQ_APPLICATION_ID }}
          stage: build
          target: "."


  # ============================================================
  # 4. BUILD DOCKER IMAGE
  # ============================================================
  build:
    name: Build Docker Image
    runs-on: [self-hosted, ifc-datalab-claims-k8s-site1-oke-np1]
    needs: nexus-iq

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute immutable image tag
        id: vars
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          IMAGE_TAG="${SHORT_SHA}-${GITHUB_RUN_NUMBER}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Docker image tag: ${IMAGE_TAG}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.APP_NAME }}:${{ steps.vars.outputs.image_tag }}

          # Export image as tar file.
          # This allows the image to be passed to other jobs.
          outputs: type=docker,dest=image.tar

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1


  # ============================================================
  # 5. GENERATE SBOM
  # ============================================================
  sbom:
    name: SBOM - Syft
    runs-on: [self-hosted, ifc-datalab-claims-k8s-site1-oke-np1]
    needs: build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i image.tar

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          image: "${{ env.APP_NAME }}:${{ needs.build.outputs.image_tag }}"
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json


  # ============================================================
  # 6. TWISTLOCK / PRISMA CLOUD IMAGE SCAN
  # ============================================================
  twistlock-scan:
    name: Twistlock / Prisma Cloud Image Scan
    runs-on: [self-hosted, ifc-datalab-claims-k8s-site1-oke-np1]
    needs: build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i image.tar

      - name: Download twistcli
        shell: bash
        run: |
          curl -k \
            -u "${{ secrets.PRISMA_COMPUTE_USER }}:${{ secrets.PRISMA_COMPUTE_PASSWORD }}" \
            --output twistcli \
            "${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}/api/v1/util/twistcli"

          chmod +x twistcli

      - name: Run Twistlock image scan
        shell: bash
        run: |
          ./twistcli images scan \
            --address "${{ secrets.PRISMA_COMPUTE_CONSOLE_URL }}" \
            --user "${{ secrets.PRISMA_COMPUTE_USER }}" \
            --password "${{ secrets.PRISMA_COMPUTE_PASSWORD }}" \
            --details \
            --output-file twistlock-results.json \
            "${APP_NAME}:${{ needs.build.outputs.image_tag }}"

      - name: Upload Twistlock results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twistlock-results
          path: twistlock-results.json
          if-no-files-found: ignore


  # ============================================================
  # 7. PUBLISH TO NEXUS
  #
  # IMPORTANT:
  # This runs only for pushes to main/develop.
  # It will NOT publish images from pull requests.
  # ============================================================
  publish-nexus:
    name: Publish Docker Image to Nexus
    runs-on: [self-hosted, ifc-datalab-claims-k8s-site1-oke-np1]

    needs:
      - build
      - sbom
      - twistlock-scan

    if: github.event_name == 'push'

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i image.tar

      - name: Login to Nexus Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Tag Docker image for Nexus
        shell: bash
        run: |
          docker tag \
            "${APP_NAME}:${{ needs.build.outputs.image_tag }}" \
            "${{ secrets.NEXUS_REGISTRY }}/${APP_NAME}:${{ needs.build.outputs.image_tag }}"

      - name: Push Docker image to Nexus
        shell: bash
        run: |
          docker push \
            "${{ secrets.NEXUS_REGISTRY }}/${APP_NAME}:${{ needs.build.outputs.image_tag }}"


  # ============================================================
  # 8. PUBLISH TO AWS ECR
  #
  # GitHub OIDC -> AWS IAM Role
  #
  # IMPORTANT:
  # This runs only for pushes to main/develop.
  # ============================================================
  publish-ecr:
    name: Publish Docker Image to AWS ECR
    runs-on: [self-hosted, ifc-datalab-claims-k8s-site1-oke-np1]

    needs:
      - build
      - publish-nexus

    if: github.event_name == 'push'

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Load Docker image
        run: |
          docker load -i image.tar

      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --------------------------------------------------------
      # ECR Login
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Tag image for ECR
      # --------------------------------------------------------
      - name: Tag Docker image for ECR
        shell: bash
        run: |
          docker tag \
            "${APP_NAME}:${{ needs.build.outputs.image_tag }}" \
            "${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}"

      # --------------------------------------------------------
      # Push image
      # --------------------------------------------------------
      - name: Push Docker image to ECR
        shell: bash
        run: |
          docker push \
            "${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}"

      # --------------------------------------------------------
      # Save build metadata
      # --------------------------------------------------------
      - name: Create build metadata
        shell: bash
        run: |
          {
            echo "app_name=${APP_NAME}"
            echo "image_tag=${{ needs.build.outputs.image_tag }}"
            echo "git_sha=${{ github.sha }}"
            echo "branch=${{ github.ref_name }}"
            echo "nexus_image=${{ secrets.NEXUS_REGISTRY }}/${APP_NAME}:${{ needs.build.outputs.image_tag }}"
            echo "ecr_image=${{ vars.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-metadata.txt

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: build-metadata.txt
